name: Build musica APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: unzip -q musica-android-player-with-icon.zip -d source

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.10.2'
          build-root-directory: source/musica
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musica-debug-apk
          path: source/musica/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
